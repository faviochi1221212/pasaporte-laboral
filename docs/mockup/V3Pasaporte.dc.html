<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tu pasaporte laboral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1C5FA8}a:hover{color:#123F73}</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F2F5F9; font-family: 'Roboto', system-ui, sans-serif; color: #1F2430; display: flex; flex-direction: column; overflow: hidden">
<div style="background: #FFF4E5; color: #7A4300; font-size: 11px; padding: 4px 16px; text-align: center">Prototipo · no es un sitio oficial</div>
<header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #FFFFFF; box-shadow: 0 1px 0 #E3E8EF">
<a href="V3Conversacion.dc.html" aria-label="Atrás" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F2430" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 20px; font-weight: 900; color: #C8102E">gob.pe</span>
<span style="width: 44px"></span>
</header>
<main style="flex: 1; padding: 22px 18px 22px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 30px; line-height: 1.08; font-weight: 900; text-align: center">¡Mira todo lo que sabes!</h1>
<section aria-label="Pasaporte laboral de María" style="background: #FBF8F1; border-radius: 14px; box-shadow: 0 10px 24px rgba(31, 36, 48, 0.12), 0 0 0 1px #E8E1D2; overflow: hidden">
<div style="background: #7A1F2B; color: #F3E3B8; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; font-weight: 900; letter-spacing: 2px">PASAPORTE LABORAL</span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1px">PERÚ</span>
</div>
<div style="padding: 14px 16px 6px; display: flex; gap: 12px; align-items: center; border-bottom: 1px dashed #D9CFBA">
<div style="width: 52px; height: 52px; border-radius: 26px; overflow: hidden; background: #E3F1EE; flex: none"><dc-import name="Trabajador" kind="cajera" size="{{52}}" hint-size="52px,52px"></dc-import></div>
<div style="display: flex; flex-direction: column"><strong style="font-size: 18px">María Quispe</strong><span style="font-size: 14px; color: #5A5446">Cajera · 6 años</span></div>
</div>
<div style="padding: 18px 14px 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 6px; justify-items: center">
<button onClick="{{pick.caja}}" aria-label="Sello: cuadre de caja" style="border: 0; background: transparent; padding: 0"><dc-import name="Sello" kind="caja" label="Cuadre de caja" color="#1C5FA8" rot="{{-8}}" size="{{100}}" hint-size="100px,100px"></dc-import></button>
<button onClick="{{pick.cobro}}" aria-label="Sello: cobros y pagos" style="border: 0; background: transparent; padding: 0; margin-top: 12px"><dc-import name="Sello" kind="cobro" label="Cobros y pagos" color="#C8102E" rot="{{6}}" size="{{100}}" hint-size="100px,100px"></dc-import></button>
<button onClick="{{pick.reclamo}}" aria-label="Sello: atiende reclamos" style="border: 0; background: transparent; padding: 0"><dc-import name="Sello" kind="reclamo" label="Atiende reclamos" color="#1E7A46" rot="{{-3}}" size="{{100}}" hint-size="100px,100px"></dc-import></button>
<button onClick="{{pick.inventario}}" aria-label="Sello: orden de mercadería" style="border: 0; background: transparent; padding: 0; margin-top: 8px"><dc-import name="Sello" kind="inventario" label="Orden de mercadería" color="#5B3E96" rot="{{9}}" size="{{100}}" hint-size="100px,100px"></dc-import></button>
<button onClick="{{pick.ensenar}}" aria-label="Sello: enseña a nuevos" style="border: 0; background: transparent; padding: 0"><dc-import name="Sello" kind="ensenar" label="Enseña a nuevos" color="#B45309" rot="{{-6}}" size="{{100}}" hint-size="100px,100px"></dc-import></button>
<button onClick="{{pick.grupo}}" aria-label="Sello: organiza grupos" style="border: 0; background: transparent; padding: 0; margin-top: 10px"><dc-import name="Sello" kind="grupo" label="Organiza grupos" color="#0E7490" rot="{{5}}" size="{{100}}" hint-size="100px,100px"></dc-import></button>
</div>
</section>
<div style="background: #FFFFFF; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 0 0 1px #E3E8EF">
<span style="font-size: 13px; color: #5F6B7A">{{said.label}}</span>
<span style="font-size: 17px; font-style: italic">“{{said.text}}”</span>
</div>
<a href="V3Ruta.dc.html" style="min-height: 54px; border-radius: 8px; background: #1C5FA8; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Ver a dónde te lleva<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<span style="font-size: 12px; color: #5F6B7A; text-align: center">Sellos según el catálogo de perfiles del MTPE · no es un certificado</span>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'caja' };
  }
  renderVals() {
    var self = this;
    var said = {
      caja: { label: 'Sello «Cuadre de caja» · Lo ganaste porque dijiste:', text: 'Al final del día cuadro la caja.' },
      cobro: { label: 'Sello «Cobros y pagos» · Lo ganaste porque dijiste:', text: 'Cobro en efectivo, tarjeta y Yape.' },
      reclamo: { label: 'Sello «Atiende reclamos» · Lo ganaste porque dijiste:', text: 'Si un cliente se pica, lo calmo.' },
      inventario: { label: 'Sello «Orden de mercadería» · Lo ganaste porque dijiste:', text: 'Ayudo a ordenar y reviso precios.' },
      ensenar: { label: 'Sello «Enseña a nuevos» · Lo ganaste porque dijiste:', text: 'A las nuevas les enseño la caja.' },
      grupo: { label: 'Sello «Organiza grupos» · Lo ganaste porque dijiste:', text: 'Organizo el fulbito del barrio.' }
    };
    var pick = {};
    Object.keys(said).forEach(function (k) { pick[k] = function () { self.setState({ sel: k }); }; });
    return { said: said[this.state.sel] || said.caja, pick: pick };
  }
}
</script>
</body>
</html>
