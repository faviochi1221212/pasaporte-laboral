<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ilustraciones de trabajadores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 120 120" role="img" aria-label="{{it.label}}">
<circle cx="60" cy="60" r="58" fill="{{it.bg}}"></circle>

<rect x="95" y="105" width="6" height="4" rx="1" fill="#D1D5DB"></rect>
</g>
</sc-if>

<g>

<rect x="30" y="49" width="20" height="5" rx="2" fill="#0B4F9F"></rect>
<rect x="74" y="94" width="36" height="22" rx="3" fill="#B45309"></rect>
<path d="M84 94 L84 88 L100 88 L100 94" stroke="#7C3A06" stroke-width="3" fill="none"></path>
<rect x="74" y="102" width="36" height="3" fill="#7C3A06"></rect>
<path d="M88 72 L100 84 M86 70 C84 68 85 64 88 64 L90 66 L88 68 L90 70 L92 68 L94 70 C94 73 90 74 88 72 Z" stroke="#4B5563" stroke-width="3" fill="#9CA3AF" stroke-linecap="round"></path>
</g>
</sc-if>
</svg>
<sc-if value="{{showLabels}}" hint-placeholder-val="{{false}}">
<div style="font-size: 15px; font-weight: 600; text-align: center">{{it.label}}</div>
</sc-if>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["","cajera","vendedor","limpieza","almacen","administrativo","todo"],"default":""},"size":{"editor":"int","default":120,"min":40,"max":240},"$preview":{"width":860,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    var all = [
      { k: 'cajera', label: 'Cajera', bg: '#E3F1EE' },
      { k: 'vendedor', label: 'Vendedor de tienda', bg: '#FBEBDD' },
      { k: 'limpieza', label: 'Personal de limpieza', bg: '#E2EEF9' },
      { k: 'almacen', label: 'Almacén y reposición', bg: '#FDF1D6' },
      { k: 'administrativo', label: 'Auxiliar administrativo', bg: '#E8EEF7' },
      { k: 'todo', label: 'Hago de todo', bg: '#F1E9E1' }
    ];
    var kind = this.props.kind || '';
    var gallery = !kind;
    var list = gallery ? all : all.filter(function (a) { return a.k === kind; });
    var items = list.map(function (a) {
      return {
        label: a.label, bg: a.bg,
        isCajera: a.k === 'cajera', isVendedor: a.k === 'vendedor', isLimpieza: a.k === 'limpieza',
        isAlmacen: a.k === 'almacen', isAdministrativo: a.k === 'administrativo', isTodo: a.k === 'todo'
      };
    });
    return {
      items: items,
      size: this.props.size ?? 120,
      showLabels: gallery,
      gap: gallery ? '40px' : '0px',
      pad: gallery ? '48px' : '0px',
      ground: gallery ? '#FFFFFF' : 'transparent'
    };
  }
}
</script>
</body>
</html>
