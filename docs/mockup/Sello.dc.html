<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sello de competencia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="font-family: 'Roboto', system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: {{gap}}; padding: {{pad}}; background: {{ground}}; justify-content: center; align-items: center">
<sc-for list="{{items}}" as="s" hint-placeholder-count="1">
<div style="width: {{s.size}}px; height: {{s.size}}px; transform: rotate({{s.rot}}deg); flex: none">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; border: 3px {{s.line}} {{s.color}}; background: {{s.bg}}; padding: 5px">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; border: 1.5px {{s.line}} {{s.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; text-align: center">
<svg width="{{s.icon}}" height="{{s.icon}}" viewBox="0 0 24 24" fill="none" stroke="{{s.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<sc-if value="{{s.isCaja}}" hint-placeholder-val="{{true}}"><g><rect x="3" y="10" width="18" height="10" rx="1.5"></rect><rect x="6" y="4" width="9" height="6" rx="1"></rect><path d="M7 14h2M11 14h2M15 14h2M7 17h10"></path></g></sc-if>
<sc-if value="{{s.isCobro}}" hint-placeholder-val="{{false}}"><g><ellipse cx="9" cy="7" rx="6" ry="3"></ellipse><path d="M3 7v4c0 1.7 2.7 3 6 3s6-1.3 6-3V7"></path><path d="M9 14v3c0 1.7 2.7 3 6 3s6-1.3 6-3v-4c0-1.6-2.4-2.9-5.5-3"></path></g></sc-if>
<sc-if value="{{s.isReclamo}}" hint-placeholder-val="{{false}}"><g><path d="M4 5h16v11H9l-5 4z"></path><path d="M9 10.5c1 1.3 5 1.3 6 0"></path></g></sc-if>
<sc-if value="{{s.isInventario}}" hint-placeholder-val="{{false}}"><g><path d="M3 9l9-5 9 5-9 5z"></path><path d="M3 9v7l9 5 9-5V9M12 14v7"></path></g></sc-if>
<sc-if value="{{s.isEnsenar}}" hint-placeholder-val="{{false}}"><g><circle cx="7" cy="7" r="3"></circle><path d="M2 20c0-3 2.5-5 5-5s5 2 5 5"></path><rect x="13" y="4" width="9" height="7" rx="1"></rect><path d="M11 13l3-2"></path></g></sc-if>
<sc-if value="{{s.isGrupo}}" hint-placeholder-val="{{false}}"><g><circle cx="12" cy="12" r="8"></circle><path d="M12 8l3 2-1 3.5h-4L9 10z"></path><path d="M12 4v4M20 11l-5-1M17 19l-3-5.5M7 19l3-5.5M4 11l5-1"></path></g></sc-if>
<sc-if value="{{s.isExcel}}" hint-placeholder-val="{{false}}"><g><rect x="3" y="4" width="18" height="16" rx="1.5"></rect><path d="M3 9h18M3 14h18M9 4v16M15 4v16"></path></g></sc-if>
<sc-if value="{{s.isKardex}}" hint-placeholder-val="{{false}}"><g><rect x="5" y="4" width="14" height="17" rx="1.5"></rect><path d="M9 3h6v3H9zM8 11h2M12 11h4M8 15h2M12 15h4"></path></g></sc-if>
<sc-if value="{{s.isSistema}}" hint-placeholder-val="{{false}}"><g><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4M7 10l2 2 4-4"></path></g></sc-if>
</svg>
<sc-if value="{{s.showLabel}}" hint-placeholder-val="{{true}}"><span style="font-size: {{s.font}}px; line-height: 1.1; font-weight: 900; letter-spacing: 0.2px; text-transform: uppercase; color: {{s.color}}; white-space: pre-line">{{s.label}}</span></sc-if>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["","caja","cobro","reclamo","inventario","ensenar","grupo","excel","kardex","sistema"],"default":""},"label":{"editor":"text","default":""},"color":{"editor":"color","default":"#1C5FA8"},"rot":{"editor":"int","default":0},"missing":{"editor":"boolean","default":false},"size":{"editor":"int","default":112},"$preview":{"width":860,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    var mk = function (k, label, color, rot, missing, size) {
      var sz = size || 112;
      return {
        label: label, rot: rot || 0, size: sz,
        icon: sz >= 80 ? Math.round(sz * 0.3) : Math.round(sz * 0.42),
        font: sz >= 110 ? 11 : (sz >= 92 ? 10 : 9),
        showLabel: sz >= 80,
        color: missing ? '#8A94A3' : color,
        bg: missing ? '#FFFFFF' : color + '14',
        line: missing ? 'dashed' : 'solid',
        isCaja: k === 'caja', isCobro: k === 'cobro', isReclamo: k === 'reclamo', isInventario: k === 'inventario',
        isEnsenar: k === 'ensenar', isGrupo: k === 'grupo', isExcel: k === 'excel', isKardex: k === 'kardex', isSistema: k === 'sistema'
      };
    };
    var p = this.props;
    var gallery = !p.kind;
    var items = gallery ? [
      mk('caja', 'Cuadre\nde caja', '#1C5FA8', -8), mk('cobro', 'Cobros y\npagos', '#C8102E', 6),
      mk('reclamo', 'Atiende\nreclamos', '#1E7A46', -4), mk('inventario', 'Orden de\nmercadería', '#5B3E96', 8),
      mk('ensenar', 'Enseña a\nnuevos', '#B45309', -6), mk('grupo', 'Organiza\ngrupos', '#0E7490', 5),
      mk('excel', 'Excel\nbásico', '', -5, true), mk('kardex', 'Control\nde stock', '', 7, true), mk('sistema', 'Sistema de\nalmacén', '', -3, true)
    ] : [mk(p.kind, p.label || '', p.color || '#1C5FA8', p.rot ?? 0, !!p.missing, p.size ?? 112)];
    return {
      items: items,
      gap: gallery ? '28px' : '0px',
      pad: gallery ? '40px' : '0px',
      ground: gallery ? '#FFFFFF' : 'transparent'
    };
  }
}
</script>
</body>
</html>
